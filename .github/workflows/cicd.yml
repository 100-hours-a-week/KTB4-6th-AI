# .github/workflows/cicd.yml
# dev 머지는 V2 staging, main 머지는 운영으로 자동 배포한다. dev 인스턴스는 수동 배포 전용이다.

name: AI 테스트·빌드 및 배포

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/meety-ai

jobs:
  test:
    name: AI 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4
      - name: uv 설정
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: 테스트 의존성 설치
        run: uv sync --frozen --all-extras --dev
      - name: pytest 실행
        run: uv run pytest
      - name: Discord 알림 (테스트 실패)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"❌ [테스트 실패] ${{ github.repository }}\nBranch: ${{ github.ref_name }} (${{ github.sha }})\nAuthor: ${{ github.actor }}\nFailed Job: test\nError Message: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "${{ secrets.DISCORD_WEBHOOK_URL }}"

  deploy-modal:
    name: Modal 화자 분리 함수 배포
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 각 환경의 Modal 토큰은 서로 다른 Workspace를 가리켜야 같은 앱 이름이 충돌하지 않는다.
    environment:
      name: ${{ github.ref_name == 'dev' && 'staging' || 'production' }}
    concurrency:
      group: deploy-modal-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'dev' && 'staging' || 'production' }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: 배포 시크릿 검증
        run: |
          # 로그에서 브랜치와 선택된 GitHub Environment를 확인한다.
          echo "::notice::Modal 배포 대상: branch=${GITHUB_REF_NAME}, environment=${DEPLOY_ENV}"
          [ -n "$MODAL_TOKEN_ID" ]     || { echo "::error::secrets.MODAL_TOKEN_ID 가 비어 있습니다"; exit 1; }
          [ -n "$MODAL_TOKEN_SECRET" ] || { echo "::error::secrets.MODAL_TOKEN_SECRET 이 비어 있습니다"; exit 1; }
          echo "::notice::Modal 배포 시크릿: MODAL_TOKEN_ID, MODAL_TOKEN_SECRET 설정됨"
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4
      - name: uv 설정
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: 배포 의존성 설치
        run: uv sync --frozen --no-dev
      # 화자 분리 함수를 등록만 하며, GPU 컨테이너는 호출될 때만 실행된다.
      - name: Modal 화자 분리 함수 배포
        run: uv run modal deploy -m meety_ai.modal_app.diarization
      - name: Discord 알림 (Modal 배포 실패)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"❌ [Modal 배포 실패] ${{ github.repository }}\nBranch: ${{ github.ref_name }} (${{ github.sha }})\nAuthor: ${{ github.actor }}\nFailed Job: deploy-modal\nError Message: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "${{ secrets.DISCORD_WEBHOOK_URL }}"

  docker-build:
    name: AI 이미지 빌드 및 게시
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha }}
      # V2 배포는 태그 대신 바뀌지 않는 digest로 이미지를 고정한다.
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4
      - name: 이미지 태그 생성
        id: vars
        # 전체 커밋 SHA로 환경별 배포 이미지를 정확히 식별한다.
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3
      - name: Docker Hub 로그인
        id: login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Discord 알림 (Docker Hub 인증 실패)
        if: failure() && steps.login.outcome == 'failure'
        run: |
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"❌ [Docker Hub 인증 실패] ${{ github.repository }}\nBranch: ${{ github.ref_name }} (${{ github.sha }})\nAuthor: ${{ github.actor }}\nFailed Job: docker-build(login)\nError Message: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "${{ secrets.DISCORD_WEBHOOK_URL }}"
      - name: AI 이미지 빌드 및 게시
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Discord 알림 (이미지 빌드 실패)
        if: failure() && steps.push.outcome == 'failure'
        run: |
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"❌ [이미지 빌드 실패] ${{ github.repository }}\nBranch: ${{ github.ref_name }} (${{ github.sha }})\nAuthor: ${{ github.actor }}\nFailed Job: docker-build(push)\nError Message: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "${{ secrets.DISCORD_WEBHOOK_URL }}"

  deploy:
    name: AI V2 prod 무중단 배포 (${{ matrix.target }})
    # Modal과 AI는 같은 production Environment의 운영 공급자를 사용한다.
    needs: [docker-build, deploy-modal]
    # main 브랜치는 서울 prod에 배포한다.
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 실시간 STT(live)와 분석(analysis)은 서로 다른 인스턴스에서 실행한다. 한쪽 배포가 실패해도 다른 쪽은 배포한다
    strategy:
      fail-fast: false
      matrix:
        # 대상별 시크릿을 명시해 값이 없어도 다른 서버 ID로 대체되지 않게 한다.
        include:
          - target: live
            instance_id_secret: AI_INSTANCE_ID
          - target: analysis
            instance_id_secret: AI_ANALYSIS_INSTANCE_ID
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-ai-v2-prod-${{ matrix.target }}
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-2
      TARGET: ${{ matrix.target }}
      INSTANCE_ID: ${{ secrets[matrix.instance_id_secret] }}
      # 인스턴스에서 띄울 컨테이너. live 인스턴스는 live만, analysis 인스턴스는 analysis만 띄운다
      ROLES: ${{ matrix.target == 'analysis' && 'analysis' || 'live' }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/meety-ai@${{ needs.docker-build.outputs.image_digest }}
      # 운영은 실제 공급자만 사용한다. staging의 mock 설정을 참조하지 않는다.
      MODE: real
      BACKEND_BASE_URL: https://api.meety.io.kr
    steps:
      - name: 배포 설정 확인
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "::notice::AI V2 prod 배포 대상: target=${TARGET}, roles=${ROLES}, mode=${MODE}, image=${IMAGE}"
          [ -n "$AWS_ROLE_ARN" ] || { echo "::error::AWS_ROLE_ARN 누락"; exit 1; }
          if [ -z "$INSTANCE_ID" ]; then
            if [ "$TARGET" = analysis ]; then echo "::error::AI_ANALYSIS_INSTANCE_ID 누락"; else echo "::error::AI_INSTANCE_ID 누락"; fi
            exit 1
          fi

      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-ai-v2-deploy-${{ github.run_id }}
          role-skip-session-tagging: true

      # 배포 스크립트 앞에 이번 배포 값을 붙여 AI 인스턴스에서 실행한다. 공급자 키는 인스턴스가 직접 읽는다.
      - name: 무중단 배포 실행
        run: |
          {
            echo '#!/bin/bash'
            printf 'IMAGE=%q\nMODE=%q\nREGION=%q\nBACKEND_BASE_URL=%q\nROLES=%q\n' \
              "$IMAGE" "$MODE" "$AWS_REGION" "$BACKEND_BASE_URL" "$ROLES"
            tail -n +2 .github/scripts/deploy-v2-prod.sh
          } > remote.sh

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy v2 ai ${TARGET} ${MODE} (run ${GITHUB_RUN_ID})" --timeout-seconds 60 \
            --parameters "$(jq -Rs '{commands: split("\n"), executionTimeout: ["900"]}' remote.sh)" \
            --query Command.CommandId --output text)

          STATUS=Pending
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          echo "::group::서버 stdout"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "::endgroup::"
          echo "::group::서버 stderr"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "::endgroup::"
          [ "$STATUS" = "Success" ] || { echo "::error::AI 배포 실패 (status=$STATUS). 기존 슬롯은 계속 서비스한다"; exit 1; }

      - name: Discord 알림 (V2 배포 실패)
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK_URL" ] || exit 0
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" --arg url "$RUN_URL" --arg target "$TARGET" \
            '{content: ("❌ [AI V2 prod 배포 실패: " + $target + "] " + $repo + "\nBranch: " + $branch + "\n" + $url)}' \
            | curl --fail --silent --show-error -H "Content-Type: application/json" --data-binary @- "$WEBHOOK_URL"


  deploy-v2-staging:
    name: AI V2 staging 무중단 배포 (${{ matrix.target }})
    # Modal 화자 분리 함수는 deploy-modal이 staging Environment 토큰으로 배포한다.
    needs: [docker-build, deploy-modal]
    # dev 브랜치의 자동 배포 대상은 V2 staging으로 고정한다.
    if: ${{ github.ref_name == 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 실시간 STT(live)와 분석(analysis)은 서로 다른 인스턴스에서 실행한다. 한쪽 배포가 실패해도 다른 쪽은 배포한다
    strategy:
      fail-fast: false
      matrix:
        # 대상별 시크릿을 명시해 값이 없어도 다른 서버 ID로 대체되지 않게 한다.
        include:
          - target: live
            instance_id_secret: AI_INSTANCE_ID
          - target: analysis
            instance_id_secret: AI_ANALYSIS_INSTANCE_ID
    environment:
      name: v2-staging
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-ai-v2-staging-${{ matrix.target }}
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-2
      TARGET: ${{ matrix.target }}
      INSTANCE_ID: ${{ secrets[matrix.instance_id_secret] }}
      # 인스턴스에서 띄울 컨테이너. live 인스턴스는 live만, analysis 인스턴스는 analysis만 띄운다
      ROLES: ${{ matrix.target == 'analysis' && 'analysis' || 'live' }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/meety-ai@${{ needs.docker-build.outputs.image_digest }}
      # mock: 가짜 공급자 앱(비용 없음), real: 실제 공급자 호출. Environment 변수로 바꾼 뒤 이 job을 다시 실행한다.
      MODE: ${{ vars.AI_PROVIDER_MODE || 'mock' }}
      BACKEND_BASE_URL: https://api-staging.meety.io.kr
    steps:
      - name: 배포 설정 확인
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "::notice::AI V2 staging 배포 대상: target=${TARGET}, roles=${ROLES}, mode=${MODE}, image=${IMAGE}"
          [ -n "$AWS_ROLE_ARN" ] || { echo "::error::AWS_ROLE_ARN 누락"; exit 1; }
          if [ -z "$INSTANCE_ID" ]; then
            if [ "$TARGET" = analysis ]; then echo "::error::AI_ANALYSIS_INSTANCE_ID 누락"; else echo "::error::AI_INSTANCE_ID 누락"; fi
            exit 1
          fi
          case "$MODE" in mock|real) ;; *) echo "::error::AI_PROVIDER_MODE는 mock 또는 real (현재: $MODE)"; exit 1 ;; esac

      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-ai-v2-deploy-${{ github.run_id }}
          role-skip-session-tagging: true

      # 배포 스크립트 앞에 이번 배포 값을 붙여 AI 인스턴스에서 실행한다. 공급자 키는 인스턴스가 직접 읽는다.
      - name: 무중단 배포 실행
        run: |
          {
            echo '#!/bin/bash'
            printf 'IMAGE=%q\nMODE=%q\nREGION=%q\nBACKEND_BASE_URL=%q\nROLES=%q\n' \
              "$IMAGE" "$MODE" "$AWS_REGION" "$BACKEND_BASE_URL" "$ROLES"
            tail -n +2 .github/scripts/deploy-v2-staging.sh
          } > remote.sh

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy v2 ai ${TARGET} ${MODE} (run ${GITHUB_RUN_ID})" --timeout-seconds 60 \
            --parameters "$(jq -Rs '{commands: split("\n"), executionTimeout: ["900"]}' remote.sh)" \
            --query Command.CommandId --output text)

          STATUS=Pending
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          echo "::group::서버 stdout"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "::endgroup::"
          echo "::group::서버 stderr"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "::endgroup::"
          [ "$STATUS" = "Success" ] || { echo "::error::AI 배포 실패 (status=$STATUS). 기존 슬롯은 계속 서비스한다"; exit 1; }

      - name: Discord 알림 (V2 배포 실패)
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK_URL" ] || exit 0
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" --arg url "$RUN_URL" --arg target "$TARGET" \
            '{content: ("❌ [AI V2 staging 배포 실패: " + $target + "] " + $repo + "\nBranch: " + $branch + "\n" + $url)}' \
            | curl --fail --silent --show-error -H "Content-Type: application/json" --data-binary @- "$WEBHOOK_URL"

